name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    # The version semantic-release cut, published by the `publish` job below.
    # Empty when the pushed commits do not warrant a release.
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: |
          npm install -D \
            semantic-release \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/github

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Tag pushes made with GITHUB_TOKEN do not trigger other workflows, so the
  # release calls the publish workflow directly instead of relying on
  # `on: push: tags`. This is the only path that publishes to crates.io.
  publish:
    name: Publish crates
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
